name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  bash-syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')

      - name: Runner smoke check
        run: bash ./run.sh list >/dev/null
