name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find . -type f -name '*.sh' -print0)

      - name: ShellCheck critical scripts
        run: |
          shellcheck run.sh setup.sh run_android_pipeline.sh lib/common.sh tests/smoke/repo_consistency.sh

      - name: Python syntax check
        run: |
          while IFS= read -r -d '' f; do
            python3 -m py_compile "$f"
          done < <(find . -type f -name '*.py' -print0)

      - name: Repo smoke checks
        run: bash tests/smoke/repo_consistency.sh
